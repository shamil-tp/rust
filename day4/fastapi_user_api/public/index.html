<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 12px; border: none; }
        .avatar-placeholder { 
            width: 80px; height: 80px; background-color: #0d6efd; color: white; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 32px; font-weight: bold; margin: 0 auto;
        }
        #viewCardSection { display: none; /* Hidden by default until fetched */ }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">User Management Portal</h2>
    
    <!-- Notification Area -->
    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="row g-4">
        <!-- SECTION 1: INSERTION FORM -->
        <div class="col-md-6">
            <div class="card card-custom p-4 h-100">
                <h4 class="mb-3 text-primary">Create New User</h4>
                <form id="createUserForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="regFirstName">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="regLastName">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" class="form-control" id="regUsername" required minlength="3">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address *</label>
                        <input type="email" class="form-control" id="regEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password *</label>
                        <input type="password" class="form-control" id="regPassword" required minlength="6">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Bio</label>
                        <textarea class="form-control" id="regBio" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create User</button>
                </form>
            </div>
        </div>

        <div class="col-md-6">
            <!-- SECTION 2: FETCHING FORM -->
            <div class="card card-custom p-4 mb-4">
                <h4 class="mb-3 text-success">Find User</h4>
                <form id="fetchUserForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="loginUsername" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Fetch Details</button>
                </form>
            </div>

            <!-- SECTION 3: VIEW CARD -->
            <div id="viewCardSection" class="card card-custom p-4 text-center mt-3 border-top border-4 border-success">
                <div class="avatar-placeholder mb-3" id="cardAvatar">U</div>
                <h3 class="card-title mb-1" id="cardFullName">John Doe</h3>
                <p class="text-muted mb-3">@<span id="cardUsername">johndoe</span></p>
                
                <div class="d-flex justify-content-center gap-2 mb-3">
                    <span class="badge bg-primary" id="cardRole">User</span>
                    <span class="badge bg-success" id="cardStatus">Active</span>
                </div>

                <ul class="list-group list-group-flush text-start mb-3">
                    <li class="list-group-item"><strong>Email:</strong> <span id="cardEmail">john@example.com</span></li>
                    <li class="list-group-item"><strong>Bio:</strong> <span id="cardBio">No bio provided.</span></li>
                    <li class="list-group-item"><strong>Joined:</strong> <span id="cardJoined">Jan 1, 2023</span></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Logic -->
<script>
    const alertBox = document.getElementById('alertBox');
    const viewCardSection = document.getElementById('viewCardSection');

    function showAlert(message, type) {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
        setTimeout(() => alertBox.classList.add('d-none'), 5000);
    }

    // 1. Create User Logic
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            firstName: document.getElementById('regFirstName').value,
            lastName: document.getElementById('regLastName').value,
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            bio: document.getElementById('regBio').value
        };

        try {
            const response = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                showAlert('User created successfully!', 'success');
                document.getElementById('createUserForm').reset();
            } else {
                showAlert(data.error || 'Failed to create user', 'danger');
            }
        } catch (error) {
            showAlert('Server error. Is the backend running?', 'danger');
        }
    });

    // 2 & 3. Fetch User and Populate Card Logic
    document.getElementById('fetchUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        
        // Hide card initially on new fetch attempt
        viewCardSection.style.display = 'none';

        try {
            // Using query parameters as per your GET endpoint design
            const response = await fetch(`/api/user?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
            const data = await response.json();

            if (response.ok) {
                // Populate the UI Card
                document.getElementById('cardFullName').textContent = data.fullName || data.firstName || username;
                document.getElementById('cardUsername').textContent = data.username;
                document.getElementById('cardEmail').textContent = data.email;
                document.getElementById('cardBio').textContent = data.bio || 'No bio provided.';
                document.getElementById('cardRole').textContent = (data.role || 'User').toUpperCase();
                
                // Format the date
                const date = new Date(data.createdAt);
                document.getElementById('cardJoined').textContent = date.toLocaleDateString();
                
                // Set Avatar initial
                document.getElementById('cardAvatar').textContent = data.username.charAt(0).toUpperCase();

                // Show the beautiful card
                viewCardSection.style.display = 'block';
                showAlert('User found!', 'success');
            } else {
                showAlert(data.error || 'Invalid credentials', 'danger');
            }
        } catch (error) {
            showAlert('Server error. Is the backend running?', 'danger');
        }
    });
</script>

</body>
</html>
